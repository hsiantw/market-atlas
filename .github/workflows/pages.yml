name: Publish Market Atlas
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site-data --repo "$GITHUB_REPOSITORY" --pattern site.zip --dir snapshot
          mkdir public
          unzip -q snapshot/site.zip -d public
          test -s public/index.html
          test -s public/symbols.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
